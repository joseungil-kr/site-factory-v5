name: Todayflower 5070-page customer-copy and isolated noindex QA
on:
  push:
    branches: [site/todayflower-nalmada-pilot-20261030]
    paths: ['.github/workflows/todayflower-pilot-qa.yml']
permissions:
  contents: read
concurrency:
  group: todayflower-customer-copy-noindex-only
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert only Todayflower isolated candidate; never publish here
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('sites/todayflower-nalmada/site.json').read_text())
          assert s['id']=='todayflower-nalmada'
          assert s['domain']=='https://todayflower.nalmada.net'
          assert s['publishEnabled'] is False and s['indexNow']['enabled'] is False
          assert s['todayflowerNational']['previewOnly'] is True
          assert len(s['imagePool'])==10
          assert len(list(Path('assets/library/todayflower').glob('*.webp')))==10
          print('TODAYFLOWER_NO_PUBLIC_WRITES_PREVIEW_ONLY_PASS')
          PY
      - name: Validate Todayflower production generator and current tests
        run: |
          python -m py_compile v5/todayflower_regions.py v5/todayflower_markup.py v5/todayflower_copy_pool.py scripts/audit_todayflower_customer.py
          python -m unittest discover -s tests -p test_todayflower_pilot.py -v
          python -m unittest discover -s tests -p test_todayflower_copy_quality.py -v
          python -m unittest discover -s tests -p test_todayflower_national.py -v
          python -m v5 plan-check --site todayflower-nalmada
      - name: Generate and audit all 5070 HTML documents without publishing
        run: |
          python -m v5 build --site todayflower-nalmada --mode preview
          python -m v5 audit --site todayflower-nalmada
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('dist/todayflower-nalmada')
          assert len(list(root.glob('*.html')))==5071
          assert (root/'404.html').is_file()
          assert (root/'405.html').is_file()
          assert (root/'5071.html').is_file()
          assert not (root/'sitemap.xml').exists()
          assert (root/'robots.txt').read_text()=='User-agent: *\nDisallow: /\n'
          manifest=json.loads(Path('reports/todayflower-nalmada/manifest.json').read_text())
          audit=json.loads(Path('reports/todayflower-nalmada/audit.json').read_text())
          assert manifest['pageCount']==5070 and manifest['assetFileCount']==5087
          assert len(manifest['files'])==5087
          assert audit['errors']==[],audit['errors']
          assert audit['similarityPopulation']==5070 and audit['similarityPairs']==1275
          assert audit['maxBodyChar5gramJaccard']<.49,audit['maxBodyChar5gramJaccard']
          for p in ['index.html','4.html','28.html','29.html','34.html','403.html','405.html','2500.html','5071.html']:
              text=(root/p).read_text(encoding='utf-8')
              assert '<meta name="robots" content="noindex,nofollow">' in text and 'rel="canonical"' not in text
              assert text.count('src="/assets/images/')==7,p
              assert text.count('width="1448" height="1086"')==5,p
              assert 'fwith.co.kr/shop/item.php?it_id=' in text,p
              for phrase in ('AI 연출 이미지','실제 상품 제작·배송 증빙이 아닙니다',
                             '법정동 코드는','오늘 도착을 보장하지 않습니다'):
                  assert phrase not in text,(p,phrase)
              assert '<meta property="og:image" content="https://todayflower.nalmada.net/assets/images/' in text,p
          print('TODAYFLOWER_ALL_5070_NO_INDEX_OUTPUT_AND_COPY_GATE_PASS')
          PY
      - name: Deterministic 51-page scoring and sample URL audit
        run: |
          python scripts/audit_todayflower_customer.py
      - name: Real Chromium 390 and 1440 viewport regression
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import json,time,subprocess
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          root=Path('dist/todayflower-nalmada')
          shots=Path('reports/todayflower-nalmada/screenshots')
          shots.mkdir(parents=True,exist_ok=True)
          process=subprocess.Popen(['python','-m','http.server','8133','--bind','127.0.0.1','--directory',str(root)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          rows=[]
          try:
              time.sleep(1)
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True)
                  for width in (390,1440):
                      context=browser.new_context(viewport={'width':width,'height':900})
                      for route in ('/','/3.html','/28.html','/29.html','/34.html','/403.html','/405.html','/2500.html','/5071.html'):
                          page=context.new_page()
                          resp=page.goto('http://127.0.0.1:8133'+route,wait_until='domcontentloaded',timeout=30000)
                          assert resp and resp.status==200,(width,route)
                          assert page.locator('h1').count()==1
                          assert page.evaluate('document.documentElement.scrollWidth<=window.innerWidth+1'),(width,route)
                          imgs=page.locator('img[src^="/assets/images/"]')
                          assert imgs.count()==7,(width,route,imgs.count())
                          assert imgs.evaluate_all('(xs)=>{xs.forEach(x=>x.loading="eager");return Promise.all(xs.map(x=>x.decode().then(()=>true).catch(()=>false))).then(a=>a.every(Boolean))}'),(width,route)
                          assert page.locator('a[href^="https://fwith.co.kr/shop/item.php?it_id="]').count()>=4,(width,route)
                          for anchor in ('choices','products','order'):
                              assert page.locator('#'+anchor).count()==1,(width,route)
                          page.screenshot(path=str(shots/(route.strip('/').replace('.html','') or 'home')+'-'+str(width)+'.png'),full_page=True)
                          rows.append({'width':width,'route':route,'http':resp.status,'editorialImages':7,'noOverflow':True})
                          page.close()
                      context.close()
                  browser.close()
          finally:
              process.terminate();process.wait(timeout=10)
          (shots.parent/'customer-browser-qa.json').write_text(json.dumps(rows,indent=2)+'\n')
          print('TODAYFLOWER_CUSTOMER_CHROMIUM_SCREENS_PASS',len(rows))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: todayflower-customer-qa-${{ github.sha }}
          path: |
            reports/todayflower-nalmada/
            dist/todayflower-nalmada/
          if-no-files-found: warn
          retention-days: 14
