name: Todayflower nationwide 5070-page isolated noindex QA
on:
  push:
    branches: [site/todayflower-nalmada-pilot-20261030]
    paths: ['.github/workflows/todayflower-pilot-qa.yml']
permissions:
  contents: read
concurrency:
  group: todayflower-nalmada-pilot-only
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Site-only tests and V5 planning gate
        run: |
          python -m unittest discover -s tests -p test_todayflower_pilot.py -v
          python -m unittest discover -s tests -p test_todayflower_copy_quality.py -v
          python -m py_compile v5/todayflower_regions.py v5/todayflower_markup.py tests/test_todayflower_national.py
          # Nationwide copy includes 32 checked customer-decision variants; keep the strict 49 percent similarity gate.
          python -m unittest discover -s tests -p test_todayflower_national.py -v
          python -m v5 plan-check --site todayflower-nalmada
      - name: Reuse V5 engine for 5070 national legal-region noindex pages
        run: |
          python -m v5 build --site todayflower-nalmada --mode preview
          python -m v5 audit --site todayflower-nalmada
          python - <<'PY'
          from pathlib import Path
          root=Path('dist/todayflower-nalmada')
          assert len(list(root.glob('*.html')))==5071
          assert (root/'404.html').is_file()
          assert (root/'405.html').is_file()
          assert (root/'5071.html').is_file()
          assert '페이지를 찾을 수' in (root/'404.html').read_text(encoding='utf-8')
          assert 'fwith.co.kr/shop/item.php?it_id=' in (root/'405.html').read_text(encoding='utf-8')
          for p in (['index.html']+[f'{n}.html' for n in range(2,5072) if n!=404]):
              html=(root/p).read_text(encoding='utf-8')
              assert 'noindex,nofollow' in html and 'rel="canonical"' not in html
              assert html.count('src="/assets/images/')==7
              assert 'fwith.co.kr/shop/item.php?it_id=' in html
          for filename in (['index.html']+[f'{n}.html' for n in range(2,5072) if n!=404]):
              html=(root/filename).read_text(encoding='utf-8')
              assert html.count('width="1448" height="1086"') == 5
              assert 'width:96px' not in html and 'width="96"' not in html
          import json
          manifest=json.loads(Path('reports/todayflower-nalmada/manifest.json').read_text())
          audit=json.loads(Path('reports/todayflower-nalmada/audit.json').read_text())
          assert manifest['pageCount']==5070 and manifest['mode']=='preview'
          assert manifest['assetFileCount']==5087
          assert audit['similarityPopulation']==51 and audit['similarityPairs']==1275
          assert audit['similarityMode']=='fixed-stratified-1pct' and audit['maxBodyChar5gramJaccard']<0.49
          assert audit['errors']==[],audit['errors']
          assert all('1%' in w and 'stratified' in w for w in audit['warnings']) and len(audit['warnings'])==1,audit['warnings']
          # Full article+FAQ Korean-language QA, not sample-only; audited separately above.
          from v5.config import read_site
          paragraphs=read_site('todayflower-nalmada')['pages']
          assert len(paragraphs)==5070
          assert len(paragraphs[:33])==33
          seen=set()
          for page in paragraphs[:33]:
              for body in [page['intro']]+[s['paragraph'] for s in page['sections']]+[q['a'] for q in page['faq']]:
                  assert body not in seen,(page['number'],'identical paragraph')
                  seen.add(body)
          assert len(seen)==264,(len(seen),'unique paragraphs')
          visible_field_count=sum(5+2*len(p['sections'])+2*len(p['faq']) for p in paragraphs[:33])
          assert visible_field_count==627,visible_field_count
          print('TODAYFLOWER_33_PAGE_264_BLOCK_GRAMMAR_DUPLICATE_GATE_PASS')
          frozen={'1':'d953d6d3bb9656d38a40b96d72f6f143b7798458584480d47671d06b3426cf46',
                  '2':'0a009dbb94464ed4a947caa5e57d208cc9730db190192f38a6554f63a7502838',
                  '3':'a91608f863010dae2cc634125c1f2d8103adaa4a0ffc42a52b8d35e1ba24fb8e'}
          assert all(manifest['contentHashes'][num]==sha for num,sha in frozen.items())
          # Preserve all 33 reviewed page content bodies and numbered paths.
          stored=json.loads(Path('sites/todayflower-nalmada/pages.json').read_text())
          from v5.engine import stable_hash
          assert len(stored)==33
          for page in stored:
              number=str(page['number'])
              expected_hash=stable_hash({
                  'intro':page['intro'],'sections':page['sections'],'faq':page.get('faq',[]),
                  'title':page['title'],'region':page['region'],'productSkus':page['productSkus']})
              assert manifest['contentHashes'][number]==expected_hash,('PILOT_CONTENT_CHANGED',number)
          assert len(manifest['contentHashes'])==5070
          assert len(manifest['files'])==5087
          assert not any(k.endswith('/sitemap.xml') for k in manifest['files'])

          # Site-only editorial correction: no unresolved Korean placeholder particles in the 30 new documents.
          for n in range(4,34):
              article=(root/f'{n}.html').read_text(encoding='utf-8')
              assert '을(를)' not in article,(n,'unnatural placeholder particle')
              assert '무조건 당일배송' not in article and '최저가 보장' not in article
          semantic_bans=(
              '관련 꽃을 주문하실 계획',
              '관련 꽃을 오늘 받을 수',
              '상황에서 꽃 종류와 상품을 어떻게 비교',
              '관련 주문은 실제 수령 일정',
              '에 관한 선택이라면 필수 조건'
          )
          for file in (['index.html']+[f'{n}.html' for n in range(2,34)]):
              rendered=(root/file).read_text(encoding='utf-8')
              assert all(term not in rendered for term in semantic_bans),('UNNATURAL_SEMANTIC_TEMPLATE',file)
          for file,word in (('4.html','정확한 구·동'),('28.html','수령자 부재 시'),('29.html','추가배송비·최종 결제금액')):
              assert word in (root/file).read_text(encoding='utf-8'),('SEMANTIC_CONTEXT_MISSING',file,word)
          print('TODAYFLOWER_33PAGE_INTENT_NOT_PRODUCT_QA_PASS')
          assert not (root/'sitemap.xml').exists()
          assert (root/'robots.txt').read_text()=='User-agent: *\nDisallow: /\n'
          copy_quality={
              'site':'todayflower-nalmada',
              'scope':'5070 nationwide legal-name previews; original 33 reviewed guides preserved; rest not independently validated for delivery',
              'fullVisibleTextCheck':True,
              'visiblePageFieldsChecked':visible_field_count,
              'allRenderedHTMLVisibleTextChecked':33,
              'paragraphBlocksCompared':264,
              'identicalParagraphBlocks':0,
              'regionLedger':'V4 official ZIP pinned 2026-10-22, NOT a new official registry query',
              'originalPilotContentHashUnchanged':True,
              'semanticIntentChecks':'33 rendered HTML pages and 16 scenario-specific title/heading cases',
              'forbiddenMetaProductTemplatesFound':0,
              'samplePairComparisons':audit['similarityPairs'],
              'fullPopulationExactBodyHashChecked':5070,
              'maxBodyChar5gramJaccard':audit['maxBodyChar5gramJaccard'],
              'seoAuditErrors':audit['errors'],
              'seoAuditWarnings':audit['warnings'],
              'noindex':True,
              'newHtmlCount':5070
          }
          Path('reports/todayflower-nalmada/copy-qa.json').write_text(
              json.dumps(copy_quality,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('TODAYFLOWER_NATIONAL_5070PAGE_NO_INDEX_QA_PASS')
          PY
      - name: Sample nationwide and previous pilot 18 Chromium screens 390 and 1440 pixels
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from pathlib import Path
          import subprocess,time,json
          from playwright.sync_api import sync_playwright
          root=Path('dist/todayflower-nalmada')
          screenshots=Path('reports/todayflower-nalmada/screenshots')
          screenshots.mkdir(parents=True,exist_ok=True)
          process=subprocess.Popen(['python','-m','http.server','8133','--bind','127.0.0.1','--directory',str(root)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          results=[]
          try:
              time.sleep(1)
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True)
                  for width in (390,1440):
                      context=browser.new_context(viewport={'width':width,'height':900})
                      for route,name in (('/','city'),('/4.html','sangnok-ward'),('/28.html','receiver-absent'),('/29.html','shipping-fee'),('/33.html','last-reviewed-dong'),('/34.html','first-national'),('/403.html','before-404'),('/405.html','after-404'),('/2500.html','national-2500'),('/5071.html','last-national')):
                          page=context.new_page()
                          response=page.goto('http://127.0.0.1:8133'+route,wait_until='domcontentloaded',timeout=30000)
                          page.locator('.tf-layout').wait_for()
                          assert response and response.status==200
                          assert page.locator('h1').count()==1
                          assert page.locator('.tf-hero h1').evaluate(
                              "e => getComputedStyle(e).wordBreak") == 'keep-all'
                          assert page.locator('a[href^="tel:"]').count()>=1
                          assert page.locator('img[src^="/assets/images/"]').count()==7
                          assert page.locator('.tf-story-item img').count()==5
                          assert page.evaluate('document.documentElement.scrollWidth<=window.innerWidth+1')
                          original_lazy=page.locator('.tf-story-item img').evaluate_all("(imgs)=>imgs.map(i=>i.getAttribute('loading'))")
                          assert original_lazy==['lazy']*5,(width,route,'original source must use lazy loading')
                          local=page.locator('img[src^="/assets/images/"]')
                          assert local.evaluate_all('(imgs)=>{imgs.forEach(i=>i.loading="eager"); return Promise.all(imgs.map(i=>i.decode().then(()=>true).catch(()=>false))).then(a=>a.every(Boolean));}')
                          seller=page.locator('.tf-product img').evaluate_all("""
                            (imgs)=>{imgs.forEach(i=>i.loading='eager');
                            return Promise.all(imgs.map(i=>Promise.race([
                              i.decode().then(()=>({sku:i.alt,src:i.src,ok:i.naturalWidth>0})).catch(()=>({sku:i.alt,src:i.src,ok:false})),
                              new Promise(resolve=>setTimeout(()=>resolve({sku:i.alt,src:i.src,ok:false,timeout:true}),9000))
                            ])));}""")
                          # Original five WebPs: inspect actual browser dimensions and CSS box, not HTML attributes alone.
                          measurements=page.locator('.tf-story-item img').evaluate_all("""
                          async imgs => {
                            return Promise.all(imgs.map(async img => {
                              const requestedLoading=img.getAttribute('loading');
                              img.loading='eager';
                              await img.decode();
                              const r=img.getBoundingClientRect();
                              return {file:img.getAttribute('src').split('/').pop(),naturalWidth:img.naturalWidth,
                                naturalHeight:img.naturalHeight,displayWidth:Math.round(r.width),
                                displayHeight:Math.round(r.height),right:Math.round(r.right),
                                loading:requestedLoading,alt:img.alt};
                            }));
                          }
                          """)
                          assert len(measurements)==5,(width,route,'wrong image count')
                          for im in measurements:
                              assert (im['naturalWidth'],im['naturalHeight'])==(1448,1086),(width,route,im)
                              assert im['displayWidth']>=240,(width,route,im)
                              assert im['right']<=width+1,(width,route,im)
                              assert 'AI 연출 이미지' in im['alt']
                          grid_cols=page.locator('.tf-story-grid').evaluate(
                            "e => getComputedStyle(e).gridTemplateColumns.split(' ').filter(Boolean).length")
                          assert grid_cols==(1 if width==390 else 6),(width,route,grid_cols)
                          page.screenshot(path=str(screenshots/(name+'-'+str(width)+'.png')),full_page=True)
                          results.append({'route':route,'width':width,'status':200,'editorialImages':7,'generatedAIImages':5,
                                          'noHorizontalOverflow':True,'sellerPhotoLoaded':sum(s['ok'] for s in seller),
                                          'sellerPhotoCount':len(seller),'sellerPhotos':seller,
                                          'imageGridColumns':grid_cols,'largeAIImages':measurements})
                          page.close()
                      context.close()
                  browser.close()
          finally:
              process.terminate();process.wait(timeout=5)
          (screenshots.parent/'browser-qa.json').write_text(json.dumps(results,indent=2)+'\n')
          (screenshots.parent/'seller-image-qa.json').write_text(json.dumps([{'route':r['route'],'width':r['width'],'loaded':r['sellerPhotoLoaded'],'total':r['sellerPhotoCount']} for r in results],indent=2)+'\n')
          (screenshots.parent/'large-image-qa.json').write_text(json.dumps([{'route':r['route'],'width':r['width'],'gridColumns':r['imageGridColumns'],'images':r['largeAIImages'],'horizontalOverflow':not r['noHorizontalOverflow']} for r in results],ensure_ascii=False,indent=2)+'\n')
          print('TODAYFLOWER_NATIONAL_TWENTY_LOCAL_BROWSER_SCREENSHOTS_PASS',len(results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: todayflower-national5070-noindex-${{ github.sha }}
          path: |
            dist/todayflower-nalmada/
            reports/todayflower-nalmada/audit.json
            reports/todayflower-nalmada/manifest.json
            reports/todayflower-nalmada/browser-qa.json
            reports/todayflower-nalmada/seller-image-qa.json
            reports/todayflower-nalmada/large-image-qa.json
            reports/todayflower-nalmada/copy-qa.json
            reports/todayflower-nalmada/screenshots/
          if-no-files-found: warn
          retention-days: 14
