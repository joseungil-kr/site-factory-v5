name: Skyquote visitor-first copy, 310-page and RSS QA
on:
  push:
    branches: [rss/skyquote-production-20261103]
    paths:
      - 'scripts/skyquote_copy.py'
      - 'scripts/build_skyquote.py'
      - 'scripts/build_skyquote_ansan.py'
      - 'scripts/build_skyquote_official.py'
      - 'scripts/prepare_skyquote_official_public.py'
      - 'tests/skyquote_smoke.py'
      - 'tests/skyquote_ansan_smoke.py'
      - 'tests/skyquote_official_smoke.py'
      - 'tests/skyquote_public_smoke.py'
      - 'v5/rss.py'
      - '.github/workflows/skyquote-copy-quality-qa.yml'
  pull_request:
    paths:
      - 'scripts/skyquote_copy.py'
      - 'scripts/build_skyquote.py'
      - 'scripts/build_skyquote_ansan.py'
      - 'scripts/build_skyquote_official.py'
      - 'scripts/prepare_skyquote_official_public.py'
      - 'tests/skyquote_smoke.py'
      - 'tests/skyquote_ansan_smoke.py'
      - 'tests/skyquote_official_smoke.py'
      - 'tests/skyquote_public_smoke.py'
      - 'v5/rss.py'
      - '.github/workflows/skyquote-copy-quality-qa.yml'
permissions:
  contents: read
concurrency:
  group: skyquote-copy-quality-qa
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build all 310 pages from the frozen official upper-code source
        run: |
          set -euo pipefail
          python -m pip install pillow==11.3.0
          python -m py_compile scripts/skyquote_copy.py scripts/build_skyquote.py scripts/build_skyquote_ansan.py scripts/build_skyquote_official.py scripts/prepare_skyquote_official_public.py tests/skyquote_smoke.py tests/skyquote_ansan_smoke.py tests/skyquote_official_smoke.py tests/skyquote_public_smoke.py
          python scripts/build_skyquote_official.py
          python tests/skyquote_smoke.py
          python tests/skyquote_ansan_smoke.py
          python tests/skyquote_official_smoke.py
      - name: Prepare exact-host public pages and full-body RSS
        run: |
          python scripts/prepare_skyquote_official_public.py
          python tests/skyquote_public_smoke.py
          python -m unittest discover -s tests -p 'test_rss.py' -q
          node --test tests/skyquote-rss.test.mjs
      - name: Read actual visitor copy across home, Ansan, national and RSS sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('dist/skyquote-public')
          routes=['index.html','danwon.html','gojan.html','ansan/danwon-02.html','national/index.html','national/kr11.html']
          for route in routes:
              text=(root/route).read_text(encoding='utf-8')
              assert '영진스카이 공개 이용요금' in text or route=='national/index.html'
              assert '작업 지점까지 높이(미터)' in text or route=='national/index.html'
              assert 'AI 생성 설명 이미지' not in text and '<figcaption>' not in text
              for bad in ('업계 최저가를 주장하지 않습니다','차량 톤수만으로 작업 가능성을 보장하지 않습니다','실수를 피할 수 있습니다','단정하지 마세요','기재합니다','실제 환경을 조사한 결과가 아닌 견적용 가정'):
                  assert bad not in text,(route,bad)
              print('VISITOR_COPY_READ_PASS',route)
          feed=ET.parse(root/'rss.xml')
          for item in feed.findall('./channel/item'):
              body=item.findtext('description') or ''
              assert '영진스카이 공개 이용요금' in body
              assert 'AI 생성 설명 이미지' not in body
              for bad in ('업계 최저가를 주장하지 않습니다','단정하지 마세요','실수를 피할 수 있습니다'):
                  assert bad not in body,bad
          print('RSS_VISITOR_COPY_READ_PASS items='+str(len(feed.findall('./channel/item'))))
          PY
      - name: Chromium 390px and 1440px render of representative home, district, dong and national pages
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from pathlib import Path
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import threading
          from playwright.sync_api import sync_playwright
          root=Path('dist/skyquote-public').resolve()
          class Handler(SimpleHTTPRequestHandler):
              def __init__(self,*a,**kw):super().__init__(*a,directory=str(root),**kw)
          server=ThreadingHTTPServer(('127.0.0.1',0),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          origin='http://127.0.0.1:'+str(server.server_port)
          routes=['/','/danwon.html','/gojan.html','/ansan/danwon-02.html','/national/index.html','/national/1150000000.html']
          Path('reports/skyquote-copy').mkdir(parents=True,exist_ok=True)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for width in (390,1440):
                  for route in routes:
                      page=browser.new_page(viewport={'width':width,'height':900})
                      response=page.goto(origin+route,wait_until='networkidle',timeout=30000)
                      assert response and response.status==200,(route,width)
                      assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1'),(route,width)
                      assert page.locator('img').count()==5,(route,width)
                      for i in range(5):
                          img=page.locator('img').nth(i)
                          img.scroll_into_view_if_needed()
                          img.evaluate('e=>{e.loading="eager"}')
                          assert img.evaluate('e=>e.complete&&e.naturalWidth===1536&&e.naturalHeight===1024'),(route,i)
                      text=page.locator('body').inner_text()
                      for bad in ('AI 생성 설명 이미지','실제 시공·장비 보유 증명이 아닙니다','업계 최저가를 주장하지 않습니다','단정하지 마세요','실수를 피할 수 있습니다','기재합니다'):
                          assert bad not in text,(route,bad)
                      name=(route.strip('/').replace('/','-').replace('.html','') or 'home')+'.'+str(width)+'.png'
                      page.screenshot(path=str(Path('reports/skyquote-copy')/name),full_page=True)
                      print('SKYQUOTE_COPY_RENDER_PASS',route,width)
                      page.close()
              browser.close()
          server.shutdown()
          print('SKYQUOTE_COPY_BROWSER_QA_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyquote-visitor-copy-310-and-rss-evidence
          path: |
            dist/skyquote-public/
            reports/skyquote-copy/
          retention-days: 30
          if-no-files-found: error
