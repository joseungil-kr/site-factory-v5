name: Worker6 three sourced buyer designs private QA
on:
  push:
    branches: [site/v51-promotion-gift-plants-20261109]
    paths:
      - scripts/worker6_three_buyer_design_preview.py
      - .github/workflows/worker6-three-buyer-designs.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and inspect three actual private HTML pages
        run: |
          python scripts/worker6_three_buyer_design_preview.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/promotion-gift-plants/three-buyer-designs')
          rows=json.loads((p/'manifest.json').read_text())
          assert len(rows)==3
          for row in rows:
              h=(p/row['filename']).read_text()
              t=(p/(row['id']+'.txt')).read_text()
              assert row['allRecipientQuestions']
              assert len(t)>250 and 'noindex' in h
              for sku in row['productSkus']:
                  assert 'it_id='+sku in h
              assert '1844-0644' in h
          from html.parser import HTMLParser
          from urllib.parse import urlsplit,unquote
          class Links(HTMLParser):
              def __init__(self):super().__init__();self.hrefs=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':self.hrefs += [dict(attrs).get('href','')]
          for row in rows:
              parser=Links();parser.feed((p/row['filename']).read_text())
              for href in parser.hrefs:
                  if href.startswith('/'):
                      path=unquote(urlsplit(href).path).lstrip('/') or 'index.html'
                      assert (p/path).is_file(),(row['id'],href)
          print('THREE_PRIVATE_HTML_PASS',len(rows))
          PY
      - name: Supply existing static assets for local HTTP preview
        run: |
          mkdir -p reports/promotion-gift-plants/three-buyer-designs/assets/images
          cp templates/themes/base.css reports/promotion-gift-plants/three-buyer-designs/assets/site.css
          cp templates/themes/classic.css reports/promotion-gift-plants/three-buyer-designs/assets/theme-classic.css
          cp templates/themes/modern.css reports/promotion-gift-plants/three-buyer-designs/assets/theme-modern.css
          cp templates/themes/minimal.css reports/promotion-gift-plants/three-buyer-designs/assets/theme-minimal.css
          cp templates/calculator.js reports/promotion-gift-plants/three-buyer-designs/assets/calculator.js
          cp assets/library/promotion-plant/plant-a.svg reports/promotion-gift-plants/three-buyer-designs/assets/images/plant-a.svg
      - name: Install Korean font and browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: HTTP 390 and 1440 screenshots
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory reports/promotion-gift-plants/three-buyer-designs >/tmp/worker6-three-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break || sleep 1; done
          WORKER6_PAGES=index,2,3 node scripts/worker6-browser-qa.mjs
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import urlopen
          from urllib.parse import urljoin,urlsplit
          class A(HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,t,a):
                  if t=='a':
                      h=dict(a).get('href')
                      if h and h.startswith('/'):self.links.append(h)
          base='http://127.0.0.1:8765'
          expected={'/':'적성면','/2.html':'설악면','/3.html':'이동면'}
          visited=set()
          for path,label in expected.items():
              with urlopen(base+path) as response:
                  assert response.status==200
                  html=response.read().decode('utf-8')
              assert label in html,(path,label)
              parser=A();parser.feed(html)
              for href in parser.links:
                  target=urlsplit(href).path
                  assert target in expected,(path,target)
                  with urlopen(urljoin(base,href)) as response:
                      assert response.status==200,(path,href,response.status)
                  visited.add((path,target))
          print('HTTP_INTERNAL_LINKS_OK',len(visited),'all three purposes')
          PY

          cp reports/promotion-gift-plants/browser-qa.json reports/promotion-gift-plants/three-buyer-designs/browser-qa.json
          cp -R reports/promotion-gift-plants/screenshots reports/promotion-gift-plants/three-buyer-designs/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker6-three-buyer-private-real-html
          path: reports/promotion-gift-plants/three-buyer-designs/
          if-no-files-found: warn
