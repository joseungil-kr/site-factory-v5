name: Skyquote isolated three-page QA
on:
  push:
    branches: [feature/v5-skyquote-three-samples]
    paths:
      - 'sites/skyquote/**'
      - 'scripts/build_skyquote.py'
      - 'tests/skyquote_smoke.py'
      - '.github/workflows/skyquote-sample-qa.yml'
  pull_request:
    paths:
      - 'sites/skyquote/**'
      - 'scripts/build_skyquote.py'
      - 'tests/skyquote_smoke.py'
      - '.github/workflows/skyquote-sample-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install narrow QA dependencies
        run: |
          python -m pip install pillow==11.3.0 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify imported raster images and build
        run: |
          python -m py_compile scripts/build_skyquote.py sites/skyquote/build.py tests/skyquote_smoke.py
          python sites/skyquote/build.py
          python tests/skyquote_smoke.py
      - name: Render all three pages at 390px and 1440px
        run: |
          python - <<'PY'
          from pathlib import Path
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          import os,threading
          from playwright.sync_api import sync_playwright
          out=Path('dist/skyquote-preview').resolve()
          class Handler(SimpleHTTPRequestHandler):
              def __init__(self,*a,**kw):super().__init__(*a,directory=str(out),**kw)
          server=ThreadingHTTPServer(('127.0.0.1',0),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          origin=f'http://127.0.0.1:{server.server_port}'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for width in (390,1440):
                  for path in ('/','/danwon.html','/gojan.html'):
                      page=browser.new_page(viewport={'width':width,'height':900},device_scale_factor=1)
                      response=page.goto(origin+path,wait_until='networkidle',timeout=30000)
                      assert response and response.status==200,(path,response.status if response else None)
                      assert page.locator('h1').count()==1
                      assert page.locator('img').count()==5
                      for index in range(5):
                          img=page.locator('img').nth(index)
                          img.scroll_into_view_if_needed(timeout=10000)
                          img.evaluate("""e=>new Promise((resolve,reject)=>{if(e.complete&&e.naturalWidth>0)return resolve();const timer=setTimeout(()=>reject(new Error('Image timeout')),15000);e.addEventListener('load',()=>{clearTimeout(timer);resolve()},{once:true});e.addEventListener('error',()=>{clearTimeout(timer);reject(new Error('Image failed'))},{once:true});if(e.loading==='lazy')e.loading='eager';})""",timeout=20000)
                          assert img.evaluate('(e)=>e.complete&&e.naturalWidth===1536&&e.naturalHeight===1024')
                      assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth+1'),(path,width)
                      assert page.locator('a[href="tel:01053221952"]').count()>=1
                      assert page.locator('meta[name="robots"]').get_attribute('content')=='noindex,nofollow'
                      Path('reports/skyquote').mkdir(parents=True,exist_ok=True)
                      screenshot=Path('reports/skyquote')/((path.strip('/').replace('.html','') or 'index')+'.'+str(width)+'.png')
                      page.screenshot(path=str(screenshot),full_page=True)
                      print('RENDER_PASS',path,'width',width,'images=5','overflow=false',screenshot)
                      page.close()
              browser.close()
          server.shutdown()
          print('SKYQUOTE_BROWSER_QA_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyquote-sample-three-pages-${{ github.sha }}
          path: |
            dist/skyquote-preview/
            reports/skyquote/
          retention-days: 14
          if-no-files-found: error
