name: Wreath V5-2 nationwide 10336 noindex asset and similarity QA
on:
  push:
    branches: [feature/v52-wreath-region]
    paths:
      - '.github/workflows/wreath-region-national-qa.yml'
      - 'sites/wreath-region/copy-pool.json'
      - 'scripts/*wreath_region.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v52-wreath-national-review
  cancel-in-progress: false
jobs:
  national-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate user-approved plan, two intents and isolated Worker
        run: |
          python -m v5 plan-check --site wreath-region
          python -m unittest discover -s tests -p 'test_wreath_region.py' -v
          node --test tests/wreath-worker.test.mjs
      - name: Generate all 10336 noindex pages and run actual 5gram candidate-population checks
        run: |
          python -m scripts.build_wreath_region
          python -m scripts.qa_wreath_region
      - name: Read back complete generated site, link audit and content evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('dist/wreath-region')
          manifest=json.loads(Path('reports/wreath-region/manifest.json').read_text())
          qa=json.loads(Path('reports/wreath-region/audit.json').read_text())
          assert manifest['sample'] is False and manifest['mode']=='preview'
          assert (manifest['pageCount'],manifest['articleCount'],manifest['regionRows'])==(10336,10068,5034)
          assert qa['passes'] and qa['errorsTotal']==0,qa
          assert qa['similarity']['passes'] and qa['similarity']['thresholdExclusive']==0.49
          assert not (p/'sitemap.xml').exists()
          assert (p/'robots.txt').read_text()=='User-agent: *\nDisallow: /\n'
          html=list(p.rglob('*.html'))
          assert len(html)==10337
          for path in ('index.html','404.html','r','d','p'):
              assert (p/path).exists()
          assert all('name="robots" content="noindex,nofollow"' in (p/u).read_text()
                     for u in ('index.html','404.html'))
          assert all('rel="canonical"' not in (p/u).read_text()
                     for u in ('index.html','404.html'))
          print('WREATH_NATIONWIDE_PASS',{'contentUrls':10336,'qa':qa['passes'],
            'bodySimilarity':qa['similarity']['maximum'],'internalLinks':qa['counts']['internalLinks'],
            'sellerOrderLinks':qa['counts']['externalProductLinks']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wreath-nationwide-10336-noindex-asset-review
          path: |
            dist/wreath-region/
            reports/wreath-region/manifest.json
            reports/wreath-region/audit.json
            reports/wreath-region/similarity.json
          if-no-files-found: error
          retention-days: 14
