name: Hallflower isolated prototype QA
on:
  push:
    branches: [feature/v53-hallflower-order]
    paths: ['scripts/build_hallflower.py', 'scripts/prepare_hallflower_public_candidate.py', 'sites/hallflower/worker.public.js', 'sites/hallflower/wrangler.public-candidate.json', 'tests/hallflower-public-worker.test.mjs', 'scripts/verify_hallflower_product_photos.py', 'scripts/build_hallflower_full.py', 'scripts/audit_hallflower_full.py', 'tests/hallflower-browser-smoke.py', 'sites/hallflower/**', '.github/workflows/hallflower-preview-qa.yml']
  pull_request:
    paths: ['scripts/build_hallflower.py', 'scripts/verify_hallflower_product_photos.py', 'scripts/build_hallflower_full.py', 'scripts/audit_hallflower_full.py', 'tests/hallflower-browser-smoke.py', 'sites/hallflower/**', '.github/workflows/hallflower-preview-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Chromium test runner
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build prototype and audit output
        run: |
          python -m py_compile scripts/build_hallflower.py
          python scripts/build_hallflower.py
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          root=Path('dist/hallflower-preview')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['sourceCount']==1080 and manifest['sampleCount']==3
          pages=[root/'index.html',*sorted((root/'halls').glob('*.html'))]
          assert len(pages)==4
          for page in pages:
              t=page.read_text()
              assert 'noindex,nofollow' in t
              assert '<form' not in t.lower()
              assert 'tel:18440644' in t
              assert '<meta name="viewport"' in t
          for page in pages[1:]:
              t=page.read_text()
              assert all(x in t for x in ('빈소','리본','희망 전달시간','배송 확인','B205','B214'))
              assert '도착을 보장하지 않습니다' in t or '당일배송을 보장하지 않습니다' in t
          js=(root/'assets/site.js').read_text()
          assert 'btn.disabled=false' in js and 'addEventListener' in js
          assert 'fetch(' not in js and 'location.search' not in js
          assert '\\n' not in (root/'robots.txt').read_text(), 'robots must use actual LF'
          assert 'Disallow: /' in (root/'robots.txt').read_text()
          assert not (root/'sitemap.xml').exists()
          print('PASS: 4 pages, meta, links, fail closed, preview crawlers blocked')
          PY
      - name: Actual Chromium 390px/1440px, product checkout, JS disabled
        run: python tests/hallflower-browser-smoke.py
      - name: Verify five official product photos, names and hashes
        run: python scripts/verify_hallflower_product_photos.py
      - name: Build full noindex corpus and write similarity result
        run: |
          python scripts/build_hallflower_full.py
          python scripts/audit_hallflower_full.py
      - name: Unit-test public worker line endings and noindex guards
        run: node --test tests/hallflower-public-worker.test.mjs
      - name: Prepare and audit separate public candidate (no deployment)
        run: |
          python -m py_compile scripts/prepare_hallflower_public_candidate.py
          python scripts/prepare_hallflower_public_candidate.py
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('dist/hallflower-public-candidate')
          report=json.loads((root/'public-candidate-manifest.json').read_text())
          assert report['candidateOnly'] and report['publicReleaseBlocked']
          assert report['pages']==1081 and report['sitemapUrls']==1081
          sitemap=(root/'sitemap.xml').read_text()
          assert sitemap.count('<url>')==1081
          assert 'Sitemap: https://hallflower.nalmada.net/sitemap.xml' in (root/'robots.txt').read_text()
          html=list(root.rglob('*.html'))
          assert len(html)==1082 # 1081 indexable pages plus 404 page
          for p in html:
              t=p.read_text()
              if p.name=='404.html':
                  assert 'noindex,nofollow' in t
                  continue
              assert 'name="robots" content="index,follow"' in t
              assert 'rel="canonical" href="https://hallflower.nalmada.net/' in t
          preview=Path('dist/hallflower-full-preview')
          assert 'Disallow: /' in (preview/'robots.txt').read_text()
          assert not (preview/'sitemap.xml').exists()
          assert json.loads((preview/'manifest.json').read_text())['publicReleaseBlocked']
          print('HALLFLOWER_PUBLIC_CANDIDATE_AUDIT_PASS',report['pages'],report['sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hallflower-three-facility-preview
          path: |
            dist/hallflower-preview/
            dist/hallflower-full-preview/
          retention-days: 14
