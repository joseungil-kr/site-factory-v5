name: Hallflower isolated prototype QA
on:
  push:
    branches: [feature/v53-hallflower-order]
    paths: ['scripts/build_hallflower.py', '.github/workflows/hallflower-preview-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build prototype and audit output
        run: |
          python -m py_compile scripts/build_hallflower.py
          python scripts/build_hallflower.py
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          root=Path('dist/hallflower-preview')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['sourceCount']==1080 and manifest['sampleCount']==3
          pages=[root/'index.html',*sorted((root/'halls').glob('*.html'))]
          assert len(pages)==4
          for page in pages:
              t=page.read_text()
              assert 'noindex,nofollow' in t
              assert '<form' not in t.lower()
              assert 'tel:18440644' in t
              assert '<meta name="viewport"' in t
          for page in pages[1:]:
              t=page.read_text()
              assert all(x in t for x in ('빈소','리본','희망 전달시간','배송 확인','B205','B214'))
              assert '도착을 보장하지 않습니다' in t or '당일배송을 보장하지 않습니다' in t
          js=(root/'assets/site.js').read_text()
          assert 'btn.disabled=false' in js and 'addEventListener' in js
          assert 'fetch(' not in js and 'location.search' not in js
          assert '\\n' not in (root/'robots.txt').read_text(), 'robots must use actual LF'
          assert 'Disallow: /' in (root/'robots.txt').read_text()
          assert not (root/'sitemap.xml').exists()
          print('PASS: 4 pages, meta, links, fail closed, preview crawlers blocked')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hallflower-three-facility-preview
          path: dist/hallflower-preview/
          retention-days: 14
