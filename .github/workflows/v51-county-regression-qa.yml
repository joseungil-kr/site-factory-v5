name: V5.1 isolated county regression QA — no deploy
on:
  push:
    branches: [site/v51-county-funeral-ownerprivate-20261107]
    paths:
      - 'v5/purpose_render.py'
      - 'v5/audit.py'
      - 'tests/test_v51_county_regressions.py'
      - '.github/workflows/v51-county-regression-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Executable regex and V5.1 regression suite, only; no deployment
        run: |
          python -m py_compile v5/purpose_render.py v5/audit.py tests/test_v51_county_regressions.py
          python -m unittest tests.test_v51_county_regressions -v
      - name: Snapshot baseline V5.1 compatibility tests
        run: python -m unittest discover -s tests -p 'test_v51_*.py' -v
