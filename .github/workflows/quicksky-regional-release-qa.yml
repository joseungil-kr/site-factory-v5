name: Quicksky audited regional public build (no deployment)
on:
  push:
    branches: [feature/quicksky-nalmada-com-20261027]
    paths:
      - 'scripts/*quicksky_regional_release.py'
      - 'tests/test_quicksky_regional_release.py'
      - '.github/workflows/quicksky-regional-release-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Regressions before scoped build (sequential)
        run: |
          python -m unittest discover -s tests -q
          npm test
      - name: Fresh internal audit and 1733-page public asset verification
        run: python -m scripts.prepare_quicksky_regional_release
      - uses: actions/upload-artifact@v4
        with:
          name: quicksky-regional-public-qa
          path: |
            reports/quicksky
            deploy/quicksky/staging.wrangler.json
          if-no-files-found: error
