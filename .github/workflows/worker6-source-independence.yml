name: Worker6 source-only 5302 locality independence audit
on:
  push:
    branches: [site/v51-promotion-gift-plants-20261109]
    paths:
      - scripts/worker6_source_independence_audit.py
      - tests/test_worker6_source_independence_audit.py
      - .github/workflows/worker6-source-independence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent source mapping and regressions
        run: |
          python -m unittest tests.test_worker6_source_independence_audit -v
          python -m scripts.worker6_source_independence_audit
      - name: Upload source evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker6-5302-source-independence-evidence
          path: reports/promotion-gift-plants/source-independence/
          if-no-files-found: warn
