name: WreathPrice three-page isolated noindex QA
on:
  push:
    branches: [feature/v52-wreathprice-20261030]
    paths:
      - 'sites/wreathprice/**'
      - '.github/workflows/wreathprice-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile Python source before any other work
        run: python -m py_compile sites/wreathprice/build.py sites/wreathprice/test_pilot.py
      - name: Verify actual five WebP assets and three noindex pages (fails closed if absent)
        run: |
          python -m pip install pillow==11.3.0
          python sites/wreathprice/test_pilot.py
      - name: Record no deployment or DNS changes
        if: always()
        run: |
          echo 'WREATHPRICE_QA_ONLY; independent preview deployment remains blocked until real binary images pass.'
