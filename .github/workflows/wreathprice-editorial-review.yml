name: WreathPrice three-intent editorial review read-only
on:
  push:
    branches: [feature/v52-wreathprice-20261030]
    paths:
      - 'sites/wreathprice/editorial-review/**'
      - 'sites/wreathprice/test_editorial_review.py'
      - '.github/workflows/wreathprice-editorial-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run three only detailed editorial and evidence tests
        run: |
          python -m py_compile sites/wreathprice/test_editorial_review.py
          python sites/wreathprice/test_editorial_review.py
      - name: Install headless Chromium without changing deployment
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render each static review at 1440 and 390 pixels, check actual images and overflowing text
        run: |
          mkdir -p editorial-review-screens
          node - <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),path=require('path');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const base=path.resolve('sites/wreathprice/editorial-review');
            const names=['funeral-budget-cheongun.html','funeral-receipt-singyo.html','congratulations-format-bono.html'];
            const results=[];
            for(const [label,size] of [['desktop',{width:1440,height:900}],['mobile',{width:390,height:844}]]){
              const page=await browser.newPage({viewport:size,deviceScaleFactor:1});
              for(const name of names){
                const response=await page.goto('file://'+path.join(base,name),{waitUntil:'load',timeout:30000});
                await page.locator('figure img').last().scrollIntoViewIfNeeded();
                const q=await page.evaluate(()=>{
                  let ims=[...document.images];
                  return {h1:document.querySelector('h1')?.innerText,
                   images:ims.length,loaded:ims.filter(x=>x.complete&&x.naturalWidth>=768).length,
                   overflow:document.documentElement.scrollWidth>innerWidth,
                   robots:document.querySelector('meta[name=robots]')?.content,
                   links:[...document.querySelectorAll('tbody a[href]')].filter(x=>x.href.includes('shop/item.php?it_id=')).length};
                });
                if(q.images!==5||q.loaded!==5||q.overflow||q.robots!=='noindex,nofollow'||q.links!==5)throw Error(JSON.stringify({name,label,q}));
                const expectations=[
                  {sku:'B201',price:'59,000원'},{sku:'B203',price:'79,000원'},
                  {sku:'B205',price:'109,000원'},{sku:'C205',price:'149,000원'},
                  {sku:'C030',price:'200,000원'}];
                const cards=[];
                await page.evaluate(()=>{
                  window.__qaClicks=[];
                  for(const a of document.querySelectorAll('tbody a[href]')){
                    a.addEventListener('click',e=>{e.preventDefault();window.__qaClicks.push(a.href)},true);
                  }
                });
                for(let n=0;n<expectations.length;n++){
                  const expected=expectations[n];
                  const row=page.locator('tbody tr').nth(n);
                  await row.scrollIntoViewIfNeeded();
                  const detail=await row.evaluate((tr,expected)=>{
                    const cells=[...tr.querySelectorAll('td')], price=cells[1], link=cells[2].querySelector('a');
                    const p=price.getBoundingClientRect(),a=link.getBoundingClientRect(),container=document.querySelector('.scroll');
                    const rect=container.getBoundingClientRect();
                    const priceWhole=p.left>=0&&p.right<=innerWidth&&p.width>0&&
                      price.scrollWidth<=price.clientWidth+1;
                    const linkWhole=a.left>=0&&a.right<=innerWidth&&a.width>=80&&
                      link.getClientRects().length>0;
                    return {sku:expected.sku,price:price.innerText.trim(),expectedPrice:expected.price,
                      href:link.getAttribute('href'),priceWhole,linkWhole,
                      scrollContainerOverflow:container.scrollWidth>container.clientWidth+1,
                      cardDisplay:getComputedStyle(tr).display,
                      buttonHeight:Math.round(a.height),priceRect:[Math.round(p.left),Math.round(p.right)]};
                  },expected);
                  if(detail.price!==expected.price||!detail.href.endsWith('it_id='+expected.sku)||
                    !detail.priceWhole||!detail.linkWhole||
                    (label==='mobile'&&(detail.scrollContainerOverflow||detail.cardDisplay!=='grid'||detail.buttonHeight<44)))
                    throw Error('PRICE_OR_CTA_VISIBILITY_FAILURE '+JSON.stringify({name,label,detail}));
                  await row.locator('a').click();
                  const click=await page.evaluate(()=>window.__qaClicks.at(-1));
                  if(!click||!click.endsWith('it_id='+expected.sku))throw Error('CTA_CLICK_FAILURE '+JSON.stringify({name,label,detail}));
                  cards.push({...detail,clicked:true});
                }
                await page.locator('tbody tr').first().scrollIntoViewIfNeeded();
                await page.screenshot({path:'editorial-review-screens/'+label+'-'+name+'.png',fullPage:true});
                results.push({name,label,...q,checkedPrices:cards});
              }
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('editorial-review-screens/qa.json',JSON.stringify({passed:true,results},null,2));
            console.log('WREATHPRICE_EDITORIAL_REVIEW_RENDER_PASS '+JSON.stringify({screenshots:results.length,results}));
          })().catch(e=>{console.error(e);process.exit(1)})
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wreathprice-three-editorial-drafts-and-screens
          path: |
            sites/wreathprice/editorial-review/
            editorial-review-screens/
          if-no-files-found: warn
          retention-days: 21
