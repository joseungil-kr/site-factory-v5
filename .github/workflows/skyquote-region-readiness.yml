name: Skyquote official region public-release gate (read only)
on:
  push:
    branches: [feature/v5-skyquote-three-samples]
    paths:
      - 'sites/skyquote/official-region-reconciliation.json'
      - 'sites/skyquote/nationwide-district-source.json'
      - 'scripts/check_skyquote_public_region_readiness.py'
      - '.github/workflows/skyquote-region-readiness.yml'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require authentic official ZIP for future public regeneration; block unverified local checkout
        run: |
          python - <<'PY'
          import subprocess,sys
          cmd=[sys.executable,'scripts/check_skyquote_public_region_readiness.py']
          result=subprocess.run(cmd,capture_output=True,text=True,check=False)
          print(result.stdout)
          assert result.returncode==2, 'Known-stale third-party national source must fail closed'
          assert 'SKYQUOTE_PUBLIC_OFFICIAL_SOURCE_BLOCKED' in result.stdout
          print('SKYQUOTE_PUBLIC_SOURCE_GATE_REQUIRES_AUTHENTIC_ZIP_PASS')
          PY
