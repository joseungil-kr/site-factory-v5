name: Winterbbang full 1804 URL quality and IndexNow readiness
on:
  pull_request:
    paths:
      - 'scripts/audit_winterbbang_full_quality.py'
      - 'scripts/prepare_winterbbang_full_public.py'
      - 'sites/winterbbang/**'
      - 'tests/winterbbang-full-worker.test.mjs'
      - 'scripts/build_winterbbang_national.py'
      - '.github/workflows/winterbbang-full-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify inherited nine-paragraph corrections and pinned region ledger
        run: |
          python -m v5 plan-check --site winterbbang
          python -m unittest discover -s tests -p 'test_winterbbang_national.py' -v
          node --test tests/winterbbang-full-worker.test.mjs
      - name: Reproduce all pages and audit each public candidate
        run: |
          python -m scripts.build_winterbbang_national
          python -m scripts.audit_winterbbang_full_quality
          python -m scripts.prepare_winterbbang_full_public
      - name: Assert sitemap/canonical matches all 1804 pages and IndexNow key
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path('dist/winterbbang-public-1804')
          source=json.loads(Path('reports/winterbbang/manifest.json').read_text())
          quality=json.loads(Path('reports/winterbbang/search-quality-v2.json').read_text())
          release=json.loads(Path('reports/winterbbang/full-public-release.json').read_text())
          scope=json.loads(Path('sites/winterbbang/search-release-scope-v2.json').read_text())
          assert release['count']==scope['expectedIndexNowCount']==1804
          assert quality['pass'] and quality['totalCandidates']==1804
          assert quality['localityLowerParagraphsPerPage']==9
          assert quality['duplicatesAcrossTopAndNineLowerParagraphs']==0
          assert quality['unsupportedOrPrivatePatternsDetected']==0
          assert quality['missingInternalLinkTargets']==0
          assert quality['similarity']['max']<0.49 and quality['similarity']['violations']==0
          assert len(list(root.rglob('*.html')))==1805
          assert len(list((root/'assets/images').glob('*.webp')))==5
          assert release['selfCanonicalCount']==1804
          urls=[e.text for e in ET.parse(root/'sitemap.xml').iter() if e.tag.endswith('loc')]
          assert len(set(urls))==len(urls)==1804
          assert urls==release['allUrls']
          for entry in source['pages']:
              path=entry['path']
              doc=(root/('index.html' if path=='/' else path.lstrip('/'))).read_text()
              expected='https://winterbbang.nalmada.net'+path
              assert doc.count('<meta name="robots" content="index,follow">')==1,path
              assert doc.count('<link rel="canonical" href="'+expected+'">')==1,path
              assert 'noindex,nofollow' not in doc.split('</head>',1)[0],path
              assert 'tel:0314070103' in doc,path
          assert '<meta name="robots" content="noindex,nofollow">' in (root/'404.html').read_text()
          assert 'Allow: /' in (root/'robots.txt').read_text()
          assert 'Disallow: /' not in (root/'robots.txt').read_text()
          key=Path('sites/winterbbang/indexnow-public-key.txt').read_text().strip()
          assert (root/(key+'.txt')).read_text()==key+'\n'
          print(json.dumps({'pages':1804,'sitemap':1804,'uniqueTitles':quality['titleUnique'],
             'nineParagraphLocalities':1732,'simMax':quality['similarity']['max'],
             'keyReady':True,'previewIsolationWorkerTested':True,'submitted':False}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: winterbbang-1804-search-release-candidate-${{ github.sha }}
          path: |
            reports/winterbbang/search-quality-v2.json
            reports/winterbbang/full-public-release.json
            reports/winterbbang/similarity.json
            dist/winterbbang-public-1804/
          if-no-files-found: error
          retention-days: 45
