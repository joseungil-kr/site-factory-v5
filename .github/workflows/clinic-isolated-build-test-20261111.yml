name: Clinic isolated offline build and editorial regression QA
on:
  push:
    branches:
      - fix/clinic-editorial-qa-isolated-20261111
    paths:
      - '.github/workflows/clinic-isolated-build-test-20261111.yml'
      - 'sites/nalmada-shared3/build_national.py'
      - 'scripts/audit_clinic_162_offline.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clinic-isolated-20261111
  cancel-in-progress: false
jobs:
  isolated-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm safe isolated scope and source syntax
        run: |
          python -m py_compile sites/nalmada-shared3/build_national.py sites/nalmada-shared3/rss_feed.py scripts/audit_clinic_162_offline.py
          git rev-parse HEAD
      - name: Generate 2 real source records per site in memory
        run: |
          python - <<'PY'
          import sys, json, collections
          from pathlib import Path
          sys.path.insert(0, str(Path("sites/nalmada-shared3").resolve()))
          import build_national as m
          root=Path(".")
          regions=m.parse_regions(json.loads((root/"data/regions/nationwide_locality_candidates_5034.json").read_text()))
          original=json.loads((root/"sites/clinicflower-preview/clinicflower-copy-pool-720.json").read_text())
          m.ORIGINAL_BLOCKS=original["blocks"]
          pool=m.generate_extra_pool()
          m.GENERATED_BY_TOPIC={}
          for site,rows in pool["items"].items():
              d=collections.defaultdict(list)
              for row in rows:d[row["topic"]].append(row)
              m.GENERATED_BY_TOPIC[site]=d
          m.ORIGINAL_BY_TOPIC=collections.defaultdict(list)
          for row in original["blocks"]:
              if row["category"] in ("병원 특화","치과 특화","한의원 특화","공통 실무"):
                  m.ORIGINAL_BY_TOPIC[row["topic"]].append(row)
          m.ORIGINAL_WREATH_BY_SUBTOPIC=collections.defaultdict(list)
          for row in original["blocks"]:
              if row["category"]!="공통 실무" or row["topic"] not in ("수령 장소","선물 목적","예산","리본 문구","배송 확인","주문 방법"):continue
              if any(x in row["body"] for x in ("화분","식물","관엽","물주기","화기","꽃바구니","실내","분갈이")):continue
              key=row["topic"]+"|"+row.get("subtopic",row["title"])
              m.ORIGINAL_WREATH_BY_SUBTOPIC[key].append(row)
          assert len(m.ORIGINAL_WREATH_BY_SUBTOPIC)>=45
          for site in m.SITE_META:
              for rec in (regions[0],regions[-1]):
                  markup,substance=m.render_region(site,rec,pool,"public")
                  assert 'property="og:image"' in markup
                  assert markup.count('class="clinic-image"')==1
                  assert 'rel="canonical"' in markup
                  assert 'tel:1844-0644' in markup
                  if site=="clinicpresent":
                      assert "celebration-wreath.webp" in markup
                      assert "화분과 화환 중 받는 분에게" not in markup
                  print("SMOKE_PASS",site,rec[0],len(markup),len(substance))
          PY
      - name: Offline nationwide build - no deploy or network API
        run: |
          python sites/nalmada-shared3/build_national.py --root . --output /tmp/clinic-audit-20261111 --mode public --audit-json /tmp/clinic-build-report.json > /tmp/clinic-build.log
          python sites/nalmada-shared3/qa_seo_images.py /tmp/clinic-audit-20261111 --output /tmp/clinic-seo-audit.json > /tmp/clinic-seo.log
      - name: Inspect previous 162 plus new 162 and three fixed regression pages
        run: |
          python scripts/audit_clinic_162_offline.py /tmp/clinic-audit-20261111 --output /tmp/clinic-162-report.json > /tmp/clinic-162.log
      - name: Print audit figures from generated files
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for file in ('clinic-build-report.json','clinic-seo-audit.json','clinic-162-report.json'):
              p=Path('/tmp')/file
              if not p.exists():
                  print('MISSING_REPORT',file)
                  continue
              d=json.loads(p.read_text())
              if file=='clinic-build-report.json':
                  print('ACTUAL_BUILD',json.dumps({'htmlCount':d.get('htmlCount'),'assetCount':d.get('assetCount'),'sites':{k:{kk:vv for kk,vv in x.items() if kk not in ('paths','regionalNarrative')} for k,x in d.get('sites',{}).items()}},ensure_ascii=False))
              elif file=='clinic-162-report.json':
                  rows=d['rows']
                  print('ACTUAL_162',json.dumps({'sampleSize':len(rows),'countBySite':d['countBySite'],'automatedFailCount':d['automatedFailCount'],'scoreBySite':{site:{'min':min(x['score'] for x in rows if x['site']==site),'max':max(x['score'] for x in rows if x['site']==site)} for site in d['countBySite']},'firstSampleBySite':{site:next(x for x in rows if x['site']==site) for site in d['countBySite']}},ensure_ascii=False))
              else: print('ACTUAL_SEO',json.dumps(d,ensure_ascii=False))
          PY
      - name: Retain exact 327 generated HTML samples
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          dist=Path('/tmp/clinic-audit-20261111/public/sites')
          out=Path('/tmp/clinic-samples')
          rows=json.loads(Path('/tmp/clinic-162-report.json').read_text())['rows']
          for row in rows:
              src=dist/row['site']/row['path']
              dest=out/row['site']/row['path']
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,dest)
          assert len(list(out.rglob('*.html')))==327
          print('SAMPLE_HTML_ARCHIVED',len(list(out.rglob('*.html'))))
          PY
      - name: Capture three-site mobile and desktop regression screenshots
        run: |
          python - <<'PY'
          import shutil,subprocess,time,urllib.request
          from pathlib import Path
          dist=Path('/tmp/clinic-audit-20261111/public')
          shots=Path('/tmp/clinic-screens');shots.mkdir(exist_ok=True)
          chrome=next((x for x in ('google-chrome','google-chrome-stable','chromium','chromium-browser') if shutil.which(x)),None)
          if not chrome: raise RuntimeError('No installed headless Chromium/Chrome')
          for site in ('clinicflower','clinicopen','clinicpresent'):
              root=dist/'sites'/site
              link=root/'assets'
              if not link.exists(): link.symlink_to(Path('../../assets'))
              proc=subprocess.Popen(['python','-m','http.server','18765','--bind','127.0.0.1','--directory',str(root)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              try:
                  ready=False
                  for _ in range(30):
                      try:
                          urllib.request.urlopen('http://127.0.0.1:18765/r/00139.html',timeout=2)
                          ready=True;break
                      except Exception:time.sleep(.2)
                  if not ready:raise RuntimeError('Local HTTP failed for '+site)
                  for width,height,label in ((390,844,'mobile-390'),(1440,900,'desktop-1440')):
                      out=shots/(site+'-00139-'+label+'.png')
                      subprocess.run([chrome,'--headless=new','--no-sandbox','--disable-gpu',
                          '--hide-scrollbars','--force-device-scale-factor=1','--window-size='+str(width)+','+str(height),
                          '--screenshot='+str(out),'http://127.0.0.1:18765/r/00139.html'],
                          check=True,timeout=50,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
                      assert out.exists() and out.stat().st_size>5000,(site,label)
                      print('SCREEN_CAPTURED',site,label,out.stat().st_size)
              finally:
                  proc.terminate();proc.wait(timeout=10)
          PY
      - name: Publish only QA logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinic-isolated-qa-20261111
          if-no-files-found: warn
          retention-days: 7
          path: |
            /tmp/clinic-build-report.json
            /tmp/clinic-build.log
            /tmp/clinic-seo-audit.json
            /tmp/clinic-seo.log
            /tmp/clinic-162-report.json
            /tmp/clinic-162.log
            /tmp/clinic-samples/
            /tmp/clinic-screens/
