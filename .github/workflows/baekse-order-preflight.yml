name: Baekse order read-only Cloudflare preflight
on:
  push:
    branches: [feature/baekse-inventory-order-20261103]
    paths: ['apps/baekse-order/**', '.github/workflows/baekse-order-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read-only Cloudflare identity and domain checks
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          tok=os.environ.get("CLOUDFLARE_API_TOKEN")
          aid=os.environ.get("CLOUDFLARE_ACCOUNT_ID")
          print("CLOUDFLARE_SECRET_PRESENT", bool(tok))
          print("CLOUDFLARE_ACCOUNT_ID_PRESENT", bool(aid))
          if not tok or not aid: raise SystemExit("Missing Cloudflare deployment secrets; no changes performed")
          def read(path):
              req=urllib.request.Request("https://api.cloudflare.com/client/v4"+path,headers={"Authorization":"Bearer "+tok, "Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      j=json.load(r)
                      print("API_STATUS",path.split("?")[0],r.status,"success",j.get("success"))
                      return j.get("result") if j.get("success") else None
              except urllib.error.HTTPError as e:
                  print("API_STATUS",path.split("?")[0],e.code,"unavailable")
                  return None
          read("/user/tokens/verify")
          zones=read("/zones?name=baeksefood.com&per_page=10")
          if zones is None: print("ZONE_READABLE",False)
          else:
              print("ZONE_READABLE",True,"MATCH_COUNT",len(zones))
              for z in zones: print("ZONE_INFO",z.get("name"),"active",z.get("status")=="active","account_match",z.get("account",{}).get("id")==aid)
          read("/accounts/"+aid+"/workers/subdomain")
          read("/accounts/"+aid+"/d1/database?per_page=1")
          PY
