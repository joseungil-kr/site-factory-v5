name: V5.1 county funeral 95-page isolated build and review — NO DEPLOY
on:
  push:
    branches: [site/v51-county-funeral-ownerprivate-20261107]
    paths:
      - 'scripts/build_county_funeral_trial_inputs.py'
      - 'scripts/county_copy_pools.py'
      - 'v5/purpose_render.py'
      - 'scripts/verify_county_independent_html.py'
      - 'scripts/package_county_ownerprivate_trial.py'
      - 'tests/test_v51_county_selected_skus.py'
      - 'v5/audit.py'
      - 'assets/library/county-funeral-ownerprivate-test/**'
      - '.github/workflows/v51-county-build-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate only new county trial input (existing sites untouched)
        run: |
          python -m py_compile scripts/build_county_funeral_trial_inputs.py
          python -m scripts.build_county_funeral_trial_inputs
      - name: Validate V5.1 complete county HTML, product links, noindex and ancestry
        run: |
          python -m v5 build --site county-funeral-ownerprivate-test --mode preview
          python -m v5 audit --site county-funeral-ownerprivate-test
          python -m scripts.verify_county_independent_html --dir dist/county-funeral-ownerprivate-test
      - name: Assemble deterministic owner-private Sites ZIP without publishing
        run: |
          python -m scripts.package_county_ownerprivate_trial
      - name: Compare planned county names with generated page manifest and record trials
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          site=Path('sites/county-funeral-ownerprivate-test')
          pages=json.loads((site/'pages.json').read_text())
          manifest=json.loads(Path('reports/county-funeral-ownerprivate-test/manifest.json').read_text())
          dist=Path('dist/county-funeral-ownerprivate-test')
          assert len(pages)==95 and manifest['pageCount']==95
          assert sum(p.get('pageType')=='county' for p in pages)==82
          assert len({p['officialCode'] for p in pages if p.get('pageType')=='county'})==82
          assert all((dist/('index.html' if p['number']==1 else str(p['number'])+'.html')).exists() for p in pages)
          assert (dist/'robots.txt').read_text()=='User-agent: *\nDisallow: /\n'
          assert not (dist/'sitemap.xml').exists()
          report={'siteId':'county-funeral-ownerprivate-test','pageCount':95,'countyCount':82,
           'provinceCount':12,'previewOnly':True,'ownerPrivateDeployed':False,'publicIndexed':False}
          Path('county-trial-build-qa.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('V51_COUNTY_ISOLATED_BUILD_QA='+json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v51-county-build-metadata-NO-DEPLOY
          path: |
            county-trial-build-qa.json
            reports/county-funeral-ownerprivate-test/audit.json
            reports/county-funeral-ownerprivate-test/manifest.json
            artifacts/v51-county-independent-html-audit.json
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: county-ownerprivate-95-static-zip-NOT-DEPLOYED
          path: |
            artifacts/county-funeral-ownerprivate-95-pages.zip
            artifacts/county-funeral-ownerprivate-95-pages.sha256
            artifacts/county-funeral-ownerprivate-95-pages-manifest.json
            artifacts/v51-county-independent-html-audit.json
          if-no-files-found: error
          retention-days: 14
