name: Worker6 site-only review and approved illustration integrity
on:
  push:
    branches: [site/v51-promotion-gift-plants-20261109]
    paths:
      - v5/review_gate.py
      - tests/test_worker6_review_score_scope.py
      - scripts/worker6_illustration_integrity.py
      - tests/test_worker6_illustration_integrity.py
      - .github/workflows/worker6-review-illustration.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify scope and fail-closed image tests
        run: python -m unittest tests.test_worker6_review_score_scope tests.test_worker6_illustration_integrity -v
