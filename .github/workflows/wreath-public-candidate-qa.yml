name: Wreath V5-2 public candidate canonical and sitemap only (never deploy)
on:
  push:
    branches: [feature/v52-wreath-region]
    paths: ['.github/workflows/wreath-public-candidate-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build a public-CANDIDATE without Cloudflare writes or search submissions
        run: |
          python -m v5 plan-check --site wreath-region
          python -m scripts.build_wreath_region --public
          python -m scripts.qa_wreath_region
          python - <<'PY'
          from pathlib import Path
          import json,xml.etree.ElementTree as ET
          p=Path('dist/wreath-region')
          m=json.loads(Path('reports/wreath-region/manifest.json').read_text())
          q=json.loads(Path('reports/wreath-region/audit.json').read_text())
          assert m['mode']=='public-candidate' and not m['sample'] and m['pageCount']==10336
          assert q['passes'] and q['errorsTotal']==0 and q['similarity']['passes']
          urls=[x.text for x in ET.parse(p/'sitemap.xml').findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert len(urls)==len(set(urls))==10336
          assert all(x.startswith('https://wreath.nalmada.net/') for x in urls)
          assert (p/'robots.txt').read_text()=='User-agent: *\nAllow: /\nSitemap: https://wreath.nalmada.net/sitemap.xml\n'
          assert 'name="robots" content="index,follow"' in (p/'index.html').read_text()
          assert 'rel="canonical" href="https://wreath.nalmada.net/"' in (p/'index.html').read_text()
          assert 'name="robots" content="noindex,nofollow"' in (p/'404.html').read_text()
          print('WREATH_PUBLIC_CANDIDATE_ONLY_PASS',{'urls':len(urls),'qaErrors':0,'deployed':False})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wreath-public-candidate-report-only-no-deployment
          path: |
            dist/wreath-region/index.html
            dist/wreath-region/robots.txt
            dist/wreath-region/sitemap.xml
            dist/wreath-region/404.html
            reports/wreath-region/audit.json
            reports/wreath-region/manifest.json
          if-no-files-found: error
          retention-days: 14
