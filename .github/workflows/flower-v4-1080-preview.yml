name: Flower 1080 funeral content-first similarity QA and preview build
on:
  pull_request:
    paths:
      - 'scripts/build_flower_funeral_national.py'
      - 'scripts/prepare_flower_funeral_preview.py'
      - 'scripts/flower_design.py'
      - 'scripts/flower_visible_copy_check.py'
      - 'tests/test_flower_pool_semantics.py'
      - 'templates/flower-nalmada/site.css'
      - 'assets/library/flower-nalmada/**'
      - 'data/flower/nalmada_funeral_product_reference.json'
      - 'data/pools/flower_funeral_professional_600.v4.json'
      - 'data/pools/flower_funeral_sample_pool.json'
      - 'data/flower/v4_facilities_1080.snapshot.json'
      - 'data/flower/v4_facility_assignments_1080.snapshot.json'
      - 'data/flower/v4_assignment_policy.snapshot.json'
      - '.github/workflows/flower-v4-1080-preview.yml'
permissions:
  contents: read
jobs:
  pool-first:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned V4 pool, assignments and locations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/flower')
          facilities=json.loads((root/'v4_facilities_1080.snapshot.json').read_text())
          assigned=json.loads((root/'v4_facility_assignments_1080.snapshot.json').read_text())
          policy=json.loads((root/'v4_assignment_policy.snapshot.json').read_text())
          pool=json.loads(Path('data/pools/flower_funeral_professional_600.v4.json').read_text())
          assert len(facilities['facilities'])==facilities['count']==1080
          assert facilities['publicationAllowed'] is False
          assert len(assigned['assignments'])==1080
          assert len({x['facilityId'] for x in assigned['assignments']})==1080
          assert pool['totalUnits']==600 and pool['readyForPublication'] is False
          assert len(policy['excludedTopics'])==8
          print('SOURCE_LOCK_OK: 1080 facilities, 1080 assignments, 600 independently authored V4 copy units')
          PY
      - name: Validate all 1080 assignments and 8 topical headings
        run: python -m unittest discover -s tests -p 'test_flower_pool_semantics.py' -v
      - name: Quality gate FIRST - compare randomized 1pct of documents against all 1080
        run: |
          python -m py_compile scripts/build_flower_funeral_national.py
          python scripts/build_flower_funeral_national.py --audit-only
          test ! -d dist/flower-funeral-national-preview
      - name: Generate 1080 noindex HTML only after similarity gate
        run: python scripts/build_flower_funeral_national.py
      - name: Package branded homepage, 1080-hall search, and 404
        run: python scripts/prepare_flower_funeral_preview.py
      - name: Verify brand, preview navigation and crawler exclusion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('dist/flower-funeral-national-preview')
          index=(out/'index.html').read_text(encoding='utf-8')
          missing=(out/'404.html').read_text(encoding='utf-8')
          halls=json.loads((out/'halls.json').read_text(encoding='utf-8'))
          assert '날마다꽃' in index and 'noindex,nofollow' in index
          assert '장례식장 찾아보기' in index and 'tel:18440644' in index
          assert 'noindex,nofollow' in missing and len(halls)==1080
          assert len({h['u'] for h in halls})==1080
          assert all((out/h['u'].lstrip('/')).is_file() for h in halls)
          print('FLOWER BRANDED PREVIEW HOME AND 1080 SEARCH LINKS VERIFIED')
          PY
      - name: Reject visitor-visible draft notices and verify full-bleed image styling
        run: |
          python scripts/flower_visible_copy_check.py
      - name: Independently read generated HTML and audit report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('dist/flower-funeral-national-preview')
          files=sorted(out.glob('fh-*.html'))
          report=json.loads(Path('reports/flower-funeral/pool-1080-1pct-audit.json').read_text())
          manifest=json.loads((out/'manifest.json').read_text())
          assert report['passes'] and report['maximumSimilarity']<0.49
          assert report['sampleCountPerSeed']==11 and report['seedCount']==3
          assert report['comparisons']==3*11*1079*2
          assert report['fullPairComparisons']==2*1080*1079//2
          assert report['fullPairFailures']==0
          assert all(x['pairsAtOrAboveThreshold']==0 for x in report['fullPairwise'])
          assert report['characterLength']['minimum']>=2500
          assert report['characterLength']['maximum']<=4100
          assert not report['failures'] and report['exactDuplicateBodies']==0
          assert len(files)==manifest['pageCount']==1080
          assert manifest['qaPasses']
          titles=set()
          for p in files:
            s=p.read_text()
            assert '<meta name="robots" content="noindex,nofollow">' in s
            assert '근조화환 주문 가격안내' in s and '날마다꽃' in s
            assert '59,000원' in s and '79,000원' in s and '109,000원' in s
            assert '2026.10.22' in s and '전화 상담' in s
            assert '/assets/images/B203.jpg' in s and '/assets/css/site.css' in s
            assert 'class="article-card"' in s and 'class="product-card"' in s
            assert '<link rel="canonical"' not in s
            titles.add(s.split('<title>')[1].split('</title>')[0])
          assert len(titles)==1080, ('Unique page titles',len(titles))
          assert not (out/'sitemap.xml').exists()
          assert (out/'index.html').exists() and (out/'404.html').exists()
          assert '날마다꽃' in (out/'index.html').read_text()
          for asset in ('assets/css/site.css','assets/images/B201.jpg','assets/images/B203.jpg','assets/images/B205.jpg','assets/images/A160.jpg','assets/images/D143.jpg','assets/js/hall-search.js'):
            assert (out/asset).is_file(),asset
          assert 'Disallow: /' in (out/'robots.txt').read_text()
          print('FLOWER_1080_CONTENT_QA_PASSED',json.dumps({
            'pages':len(files),'titles':len(titles),
            'maxSimilarityPercent':100*report['maximumSimilarity'],
            'fullPairComparisons':report['fullPairComparisons'],
            'compared':report['comparisons'],
            'lengths':report['characterLength']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flower-1080-funeral-reviewed-noindex-artifacts
          path: |
            reports/flower-funeral/pool-1080-1pct-audit.json
            dist/flower-funeral-national-preview/
          retention-days: 14
          if-no-files-found: warn
