name: WreathPrice official-code limited 16-region noindex expansion QA
on:
  push:
    branches: [feature/v52-wreathprice-20261030]
    paths:
      - 'sites/wreathprice/expand.py'
      - 'sites/wreathprice/test_expansion.py'
      - 'sites/wreathprice/verified-regions.json'
      - '.github/workflows/wreathprice-expansion-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wreathprice-offline-code-verified-expansion
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Python syntax and existing five-photo hash gate
        run: |
          python -m py_compile sites/wreathprice/build.py sites/wreathprice/expand.py sites/wreathprice/test_pilot.py sites/wreathprice/test_expansion.py
          python -m pip install pillow==11.3.0
          python sites/wreathprice/test_pilot.py
      - name: Build and validate official-code restricted 16 area drafts plus original 3
        run: |
          python sites/wreathprice/test_expansion.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('sites/wreathprice/dist-expansion')
          j=json.loads((p/'expansion-report.json').read_text())
          assert (j['pilotPages'],j['expandedPages'],j['totalPages'])==(3,16,19)
          assert j['verifiedDeliveryAreas']==0 and not j['publicDeployment']
          assert len(list(p.rglob('*.html')))==19
          assert not (p/'sitemap.xml').exists()
          print('WREATHPRICE_NO_INDEX_EXPANSION_QA_PASS',{'officialCodes':16,'noindexPages':19,'realWebp':5,'editorialFocuses':j['editorialFocusCount']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wreathprice-official-16-noindex-drafts-${{ github.run_id }}
          path: |
            sites/wreathprice/dist-expansion/
            sites/wreathprice/verified-regions.json
            sites/wreathprice/image-manifest.json
          if-no-files-found: error
          retention-days: 21
